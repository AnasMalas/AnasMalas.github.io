---
layout: default
---
<article class="article-wrap h-entry" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="article-header">
    <div class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Engineering note</div>
    <h1 class="article-title p-name" itemprop="headline">{{ page.title | escape }}</h1>
    <div class="article-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%d %b %Y" }}</time>
      <span aria-hidden="true">·</span>
      <span itemprop="author" itemscope itemtype="https://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author | default: site.author }}</span></span>
      {% if page.tags and page.tags.size > 0 %}
        <span aria-hidden="true">·</span>
        <span>{{ page.tags | join: ', ' }}</span>
      {% endif %}
    </div>
  </header>

  <div class="article-body e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <div class="article-footer">
    <a class="text-link" href="{{ '/notes/' | relative_url }}">← All notes</a>
    <a class="text-link" href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url | append: page.url | url_encode }}" rel="noopener">Share on LinkedIn ↗</a>
  </div>
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
